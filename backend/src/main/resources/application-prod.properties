# ==============================================================================
# PRODUCTION ENVIRONMENT (REQUIRES ENVIRONMENT VARIABLES)
# ==============================================================================

# Server Configuration
server.port=${PORT:8080}

# HTTPS / TLS Configuration (Uncomment and configure when certificates are available)
# server.ssl.key-store=${SERVER_SSL_KEY_STORE}
# server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=kaundega

# CORS Allowed Origins (e.g. https://kaundega.com)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Database Configuration (Injected via Environment Variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:50}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.minimum-idle=5

# JPA/Hibernate Configuration (Performance)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# JWT Secret (Must be injected via environment variable in prod)
jwt.secret=${JWT_SECRET_KEY}

# Logging (Strict for prod)
logging.level.root=WARN
logging.level.com.kaundega=INFO

# Spring Boot Actuator (Monitoring & Profiling)
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.cache.instrument=true
