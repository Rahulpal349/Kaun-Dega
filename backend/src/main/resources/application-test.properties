# ==============================================================================
# TEST ENVIRONMENT (USED BY @SpringBootTest)
# ==============================================================================

# Server Configuration
server.port=0

# Database Configuration (In-Memory H2 for fast testing)
spring.datasource.url=jdbc:h2:mem:kaundega_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Secret (Hardcoded for testing ONLY)
jwt.secret=test-environment-secret-key-that-is-long-enough-for-hs256-12345678901234567890

# Logging
logging.level.root=WARN
logging.level.com.kaundega=INFO
