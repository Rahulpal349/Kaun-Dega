version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaundega-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://postgres:5432/kaundega
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=local-development-secret-key-that-is-long-enough
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kaundega-net
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: kaundega-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=kaundega
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Automatically run our init-schema script on first database creation
      - ./scripts/init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kaundega"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kaundega-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  kaundega-net:
    driver: bridge
