# ==============================================================================
# DEVELOPMENT ENVIRONMENT (DO NOT USE IN PRODUCTION)
# ==============================================================================

# Server Configuration
server.port=8080

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:3000

# Database Configuration (PostgreSQL Docker Local)
spring.datasource.url=jdbc:postgresql://localhost:5432/kaundega
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Secret (Hardcoded for local development ONLY)
jwt.secret=local-development-secret-key-that-is-long-enough-for-hs256-12345678901234567890
