# ==============================================================================
# PRODUCTION ENVIRONMENT (REQUIRES ENVIRONMENT VARIABLES)
# ==============================================================================

# Server Configuration
server.port=${PORT:8080}

# HTTPS / TLS Configuration (Uncomment and configure when certificates are available)
# server.ssl.key-store=${SERVER_SSL_KEY_STORE}
# server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=kaundega

# CORS Allowed Origins (e.g. https://kaundega.com)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Database Configuration (Injected via Environment Variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:50}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA/Hibernate Configuration
# Must be 'validate' in production to prevent accidental schema drops/alterations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.generate_statistics=true

# JWT Secret (Injected via Environment Variables)
jwt.secret=${JWT_SECRET}

# Logging (JSON structured logging recommended in production, but console level restricted)
logging.level.root=INFO
logging.level.com.kaundega=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=ERROR
# Never log web requests with headers/payloads in production to prevent token leakage
logging.level.org.springframework.web=WARN
