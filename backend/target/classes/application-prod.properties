# ===================================================================
# Spring Boot Production Configuration
# ===================================================================
spring.application.name=backend
server.port=8080

# --- Database & HikariCP ---
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/kaundega}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048

# --- Hibernate ---
# In production, NEVER use ddl-auto=update or create. Use validate.
# Database schema should be managed by DB initialization scripts or Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate Performance Monitoring
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=50

# --- Security & JWT ---
jwt.secret=${JWT_SECRET:my-super-secret-key-change-this-in-production-to-something-very-long}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# --- Actuator & Monitoring ---
# Only expose health and metrics. Do NOT expose env or heapdump in production publicly.
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.export.prometheus.enabled=true

# --- Logging ---
logging.level.root=INFO
logging.level.com.kaundega.backend=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN
